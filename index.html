<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tasks</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-red-500 flex items-center justify-center py-10 px-5">
  <div class="bg-white rounded-2xl w-full max-w-md overflow-hidden shadow-lg">

    <div class="px-6 pt-6 pb-4 border-b border-gray-200">
      <h1 class="text-2xl font-semibold text-gray-900">My Tasks</h1>
      <p class="text-sm text-gray-500 mt-1">
        Total tasks: <span id="task-count" class="font-semibold text-red-700">0</span>
      </p>
    </div>

    <div class="flex gap-2 px-6 pt-4">
      <input type="text" id="inputBox"
        class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
        placeholder="Add a task">
      <button id="addButton"
        class="bg-green-500 hover:bg-green-600 text-white text-sm font-medium px-4 py-2 rounded-lg transition">
        + Add
      </button>
    </div>

    <ul id="taskList" class="px-6 py-4 space-y-2">
      <li id="empty-state" class="text-sm text-center text-gray-400 py-6">
        No tasks yet — add one above!
      </li>
    </ul>

  </div>

  <script>
    const textBox = document.getElementById("inputBox");
    const addButton = document.getElementById("addButton");
    const taskList = document.getElementById("taskList");
    const taskCount = document.getElementById("task-count");
    const emptyState = document.getElementById("empty-state");

    function updateCount() {
      const count = taskList.querySelectorAll("li.task-item").length;
      taskCount.textContent = count;
      emptyState.style.display = count === 0 ? "" : "none";
    }

    function addTask() {
      const taskText = textBox.value.trim();
      if (taskText === '') return;

      const li = document.createElement("li");
      li.className = "task-item flex items-center justify-between gap-2 bg-gray-100 rounded-lg px-3 py-2 text-sm";

      const span = document.createElement("span");
      span.textContent = taskText;
      span.className = "break-words";

      const delBtn = document.createElement("button");
      delBtn.textContent = "Delete";
      delBtn.className = "text-red-500 hover:text-red-700 text-xs font-medium flex-shrink-0";
      delBtn.addEventListener('click', function () {
        taskList.removeChild(li);
        updateCount();
      });

      li.appendChild(span);
      li.appendChild(delBtn);
      taskList.appendChild(li);

      textBox.value = "";
      textBox.focus();
      updateCount();
    }

    addButton.addEventListener('click', addTask);
    textBox.addEventListener('keypress', function (event) {
      if (event.key === 'Enter') addTask();
    });
  </script>
</body>
</html>
